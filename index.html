<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daycare Furniture Tester</title>
  <link rel="stylesheet" href="style.css?v=125">
</head>
<body>

  <h1>Daycare Furniture Tester</h1>
  <p class="subtitle">Isometric Room &amp; Furniture Asset Previewer</p>

  <div class="main-container">
    
    <!-- 1. Canvas Stage (Top) -->
    <div class="canvas-wrapper">
      <canvas id="testerCanvas" width="512" height="640"></canvas>
    </div>

    <!-- 2. Controls Panel (Below Canvas) -->
    <div class="sidebar">
      
      <div class="control-group">
        <label for="layoutSelect">Daycare Layout</label>
        <select id="layoutSelect" onchange="changeLayout(this.value)">
          <option value="none">Select a layout...</option>
          <option value="1x1">1x1 Room</option>
          <option value="1x2">1x2 Room</option>
          <option value="2x1">2x1 Room</option>
          <option value="2x2">2x2 Room</option>
          <option value="2x3">2x3 Room</option>
          <option value="3x2">3x2 Room</option>
          <option value="3x3">3x3 Room</option>
        </select>
      </div>

      <div class="control-group">
        <label for="wallpaperSelect">Wallpaper</label>
        <select id="wallpaperSelect">
          <option value="none">None (No Wallpaper)</option>
        </select>
      </div>

      <div class="control-group">
        <label for="flooringSelect">Flooring</label>
        <select id="flooringSelect">
          <option value="none">None (No Flooring)</option>
        </select>
      </div>

      <div class="control-group">
        <label for="furnitureSelect">Select Furniture</label>
        <select id="furnitureSelect">
          <option value="none">None (Select Item)</option>
          <option value="chair">Office Chair</option>
          <option value="table">Large Table</option>
        </select>
      </div>

      <!-- Selected Item Actions -->
      <div id="selectedActionsPanel" class="hidden">
        <div class="control-group">
          <label>Selected Furniture</label>
          <div class="button-row">
            <button id="rotateCCWBtn" class="secondary">↺ Rotate</button>
            <button id="rotateCWBtn" class="secondary">↻ Rotate</button>
            <button id="deleteSelectedBtn" class="danger">Delete</button>
          </div>
        </div>
      </div>

      <button id="clearBtn" class="danger">Clear All Furniture</button>

    </div>
  </div>

  <script src="script.js?v=125" defer></script>
</body>
</html>
