<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Isometric Daycare Designer</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="app-container">
        <!-- Navigation Header -->
        <header class="top-nav">
            <nav aria-label="Tatsu resources" class="nav-links">
                <a href="https://tatsu.gg" target="_blank" rel="noopener noreferrer" class="nav-link">Tatsu</a>
                <a href="https://discord.gg/tatsu" target="_blank" rel="noopener noreferrer" class="nav-link">Server</a>
                <a href="https://tatsu.fandom.com/wiki/Tatsu_Wiki" target="_blank" rel="noopener noreferrer" class="nav-link">Wiki</a>
            </nav>
        </header>

        <div id="workspace-layout" class="workspace-layout">
            <!-- Stage / Canvas -->
            <main class="stage-panel canvas-viewport">
                <div class="stage-wrapper">
                    <div class="zoom-controls" role="group" aria-label="Zoom controls">
                        <button type="button" class="zoom-btn" onclick="adjustZoom(-0.1)" title="Zoom Out" aria-label="Zoom Out">&minus;</button>
                        <button type="button" class="zoom-btn" onclick="resetZoom()" title="Reset Zoom" aria-label="Reset Zoom to 100%">100%</button>
                        <button type="button" class="zoom-btn" onclick="adjustZoom(0.1)" title="Zoom In" aria-label="Zoom In">+</button>
                    </div>

                    <div id="stage" class="stage stage-viewport">
                        <!-- Base Room Background -->
                        <img id="room-layer" class="layer-img" alt="Daycare Layout" />
                        <!-- Floor & Wallpaper Layers -->
                        <div id="furnishings-stage-layers"></div>
                        <!-- Floor & Wall Furniture Layers -->
                        <div id="furniture-stage-layers"></div>
                    </div>
                </div>
            </main>
            <!-- Sidebar / Controls -->
            <aside class="sidebar" aria-label="Daycare controls">
                <h2>Tatsu Daycare Furniture Tester</h2>

                <!-- Layout Selector -->
                <div class="control-group">
                    <label for="layoutSelect">Layout:</label>
                    <select id="layoutSelect"></select>
                </div>

                <!-- Dynamic Room Selector Panel -->
                <div class="room-selector-panel">
                    <div class="swap-label">ROOMS</div>
                    <div id="roomButtonsGrid" class="room-buttons-grid" role="group" aria-label="Room selection"></div>
                    <!-- script.js populates #roomActionsRow here for Clear Furniture / Clear Furnishings / Clear All -->
                </div>

                <!-- Customization Workspaces -->
                <section class="section" aria-label="Customize Daycare">
                    <!-- Room Furnishings Workspace (Floor & Wallpaper) -->
                    <div id="workspace-furnishings" class="control-group workspace-card">
                        <div class="workspace-header swap-label">
                            <span>ROOM FURNISHINGS</span>
                        </div>

                        <div id="furnishings-slots-container">
                            <div class="select-row layer-row search-container">
                                <label for="slot-floor" class="layer-badge">Floor</label>
                                <input
                                    id="slot-floor"
                                    class="furnishing-search"
                                    type="text"
                                    autocomplete="off"
                                    placeholder="Search flooring..."
                                    aria-autocomplete="list"
                                    aria-controls="dropdown-floor"
                                />
                                <button
                                    id="floor-clear-btn"
                                    class="clear-btn"
                                    type="button"
                                    aria-label="Clear floor search"
                                    onclick="clearSearch('slot-floor', 'floor-clear-btn')"
                                >&times;</button>
                                <div id="dropdown-floor" class="custom-dropdown" role="listbox"></div>
                            </div>

                            <div class="select-row layer-row search-container">
                                <label for="slot-wall" class="layer-badge">Wallpaper</label>
                                <input
                                    id="slot-wall"
                                    class="furnishing-search"
                                    type="text"
                                    autocomplete="off"
                                    placeholder="Search wallpaper..."
                                    aria-autocomplete="list"
                                    aria-controls="dropdown-wall"
                                />
                                <button
                                    id="wall-clear-btn"
                                    class="clear-btn"
                                    type="button"
                                    aria-label="Clear wallpaper search"
                                    onclick="clearSearch('slot-wall', 'wall-clear-btn')"
                                >&times;</button>
                                <div id="dropdown-wall" class="custom-dropdown" role="listbox"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Furniture Workspace (Dynamic Slots & Rotations) -->
                    <div id="workspace-furniture" class="workspace-card">
                        <div class="workspace-header swap-label">
                            <span>PLACEMENT SLOTS (FURNITURE)</span>
                        </div>
                        <div id="dynamic-furniture-slots">
                            <!-- Populated automatically by script.js -->
                        </div>
                    </div>
                </section>
                <footer class="footer-note">
                If you find any issues you can message <strong>crowwaterlow</strong> on Discord :)
                </footer>
            </aside>
        </div>
    </div>

    <!-- Scripts -->
    <script src="layouts.js" defer></script>
    <script src="furniture.js" defer></script>
    <script src="furnishings.js" defer></script>
    <script src="script.js" defer></script>
</body>
</html>
