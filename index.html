<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isometric Daycare Designer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Controls -->
        <div class="sidebar">
            <h2>Daycare Designer</h2>
            
            <!-- Layout Selector -->
            <div class="control-group">
                <label for="layoutSelect">Select Layout:</label>
                <select id="layoutSelect">
                    <!-- Options populated dynamically from layouts.js -->
                </select>
            </div>

            <!-- Dynamic Room Selector Panel -->
            <div class="room-selector-panel">
                <h3>Select Room</h3>
                <div id="roomButtonsGrid" class="room-button-grid"></div>
            </div>
        </div>

        <!-- Canvas Viewport -->
        <div class="canvas-viewport">
            <canvas id="daycareCanvas" width="800" height="600"></canvas>
        </div>
    </div>

    <!-- Scripts -->
    <script src="layouts.js"></script>
    <script src="furniture.js"></script>
    <script src="furnishings.js"></script>
    <script src="script.js"></script>
</body>
</html>
