<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tatsu Daycare Furniture Tester</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Tatsu Daycare Furniture Tester</h1>
  <p class="subtitle">Multi-Room Layouts & Custom Furnishing Assets</p>

  <div class="main-container">
    <!-- Canvas Stage -->
    <div class="canvas-wrapper">
      <canvas id="testerCanvas" width="512" height="640"></canvas>
    </div>

    <!-- Control Panel -->
    <div class="sidebar">
      <div class="control-group">
        <label for="layoutSelect">Daycare Layout</label>
        <select id="layoutSelect">
          <option value="1x1 Daycare">1x1 Room (4x4 tiles)</option>
          <option value="2x1 Daycare">2x1 Rooms (8x4 tiles)</option>
          <option value="1x2 Daycare">1x2 Rooms (4x8 tiles)</option>
          <option value="2x2 Daycare" selected>2x2 Rooms (8x8 tiles)</option>
          <option value="2x3 Daycare">2x3 Rooms (8x12 tiles)</option>
          <option value="3x2 Daycare">3x2 Rooms (12x8 tiles)</option>
          <option value="3x3 Daycare">3x3 Rooms (12x12 tiles)</option>
        </select>
      </div>

      <div class="control-group">
        <label for="wallpaperSelect">Wallpaper</label>
        <select id="wallpaperSelect">
          <option value="default">Default Wallpaper</option>
          <option value="wood_wall">Wooden Panels</option>
          <option value="brick_wall">Brick Wall</option>
        </select>
      </div>

      <div class="control-group">
        <label for="flooringSelect">Flooring</label>
        <select id="flooringSelect">
          <option value="default">Default Flooring</option>
          <option value="wood_floor">Hardwood Floor</option>
          <option value="tile_floor">Ceramic Tiles</option>
        </select>
      </div>

      <div class="control-group">
        <label for="furnitureSelect">Select Furniture</label>
        <select id="furnitureSelect">
          <option value="chair">Office Chair (2x1)</option>
          <option value="table">Large Table (2x2)</option>
        </select>
      </div>

      <!-- Selected Item Actions -->
      <div class="control-group hidden" id="selectedActionsPanel">
        <label>Selected Furniture</label>
        <div class="button-row">
          <button id="rotateCCWBtn" class="secondary" title="Rotate Counter-Clockwise">↺ CCW</button>
          <button id="rotateCWBtn" class="secondary" title="Rotate Clockwise">↻ CW (<kbd>R</kbd>)</button>
        </div>
        <button id="deleteSelectedBtn" class="danger">Remove Item</button>
      </div>

      <div class="control-group">
        <button id="clearBtn" class="secondary">Clear All Furniture</button>
      </div>

      <div class="instructions">
        <strong>Controls:</strong><br>
        • Layouts load from <code>Images/Rooms/</code><br>
        • Furnishings load from <code>Images/Furnishing/</code><br>
        • Furniture loads from <code>Images/Furnitures/</code>
      </div>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
