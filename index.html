<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tatsu Daycare Furniture Tester</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Tatsu Daycare Furniture Tester</h1>
  <p class="subtitle">Multi-Room Layouts with Isometric Grid & Sprite Slicing</p>

  <div class="main-container">
    <!-- Canvas Stage -->
    <div class="canvas-wrapper">
      <canvas id="testerCanvas" width="512" height="640"></canvas>
    </div>

    <!-- Control Panel -->
    <div class="sidebar">
      <div class="control-group">
        <label for="layoutSelect">Daycare Layout</label>
        <select id="layoutSelect">
          <option value="1x1">1x1 Room (4x4 tiles)</option>
          <option value="2x1">2x1 Rooms (8x4 tiles)</option>
          <option value="1x2">1x2 Rooms (4x8 tiles)</option>
          <option value="2x2" selected>2x2 Rooms (8x8 tiles)</option>
          <option value="2x3">2x3 Rooms (8x12 tiles)</option>
          <option value="3x2">3x2 Rooms (12x8 tiles)</option>
          <option value="3x3">3x3 Rooms (12x12 tiles)</option>
        </select>
      </div>

      <div class="control-group">
        <label for="furnitureSelect">Select Furniture</label>
        <select id="furnitureSelect">
          <option value="chair">Office Chair (2x1)</option>
          <option value="table">Large Table (2x2)</option>
        </select>
      </div>

      <!-- Selected Item Actions (Hidden via CSS until an item is clicked) -->
      <div class="control-group hidden" id="selectedActionsPanel">
        <label>Selected Furniture</label>
        <div class="button-row">
          <button id="rotateCCWBtn" class="secondary" title="Rotate Counter-Clockwise">↺ CCW</button>
          <button id="rotateCWBtn" class="secondary" title="Rotate Clockwise">↻ CW (<kbd>R</kbd>)</button>
        </div>
        <button id="deleteSelectedBtn" class="danger">Remove Item</button>
      </div>

      <div class="control-group">
        <button id="clearBtn" class="secondary">Clear All Furniture</button>
      </div>

      <div class="instructions">
        <strong>Controls:</strong><br>
        • Switching layout auto-loads the room asset.<br>
        • Click a floor tile to place selected furniture.<br>
        • Click a placed item to Rotate (CW/CCW) or Remove.
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
